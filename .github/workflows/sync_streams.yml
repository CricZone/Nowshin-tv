name: Auto Sync Added Matches Streams

on:
  workflow_dispatch:

jobs:
  update-streams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Match and Sync Server Links
        env:
          API_URL: ${{ secrets.STREAM_API_URL }}
        run: |
          node -e '
          const fs = require("fs");

          const API_URL = process.env.API_URL;
          const EVENTS_FILE = "events.json";
          const CHANNELS_FILE = "channels.json";

          if (!API_URL) {
            console.error("API URL secret is missing!");
            process.exit(1);
          }

          const cleanStr = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

          async function main() {
            try {
              console.log("Fetching latest feed from API...");
              const res = await fetch(API_URL, { headers: { "User-Agent": "Mozilla/5.0" } });
              if (!res.ok) throw new Error("API response error: " + res.status);
              const data = await res.json();
              const apiMatches = Array.isArray(data) ? data : (data.matches || data.events || data.data || []);

              if (!apiMatches.length) {
                console.log("No matches found in API.");
                return;
              }

              let hasEventsChanged = false;
              let hasChannelsChanged = false;

              let eventsData = { events: [] };
              if (fs.existsSync(EVENTS_FILE)) {
                try {
                  const raw = JSON.parse(fs.readFileSync(EVENTS_FILE, "utf8"));
                  eventsData = Array.isArray(raw) ? { events: raw } : (raw.events ? raw : { events: [] });
                } catch(e) { console.error("Error reading events.json", e); }
              }

              let channelsList = [];
              if (fs.existsSync(CHANNELS_FILE)) {
                try {
                  channelsList = JSON.parse(fs.readFileSync(CHANNELS_FILE, "utf8"));
                } catch(e) { console.error("Error reading channels.json", e); }
              }

              if (!eventsData.events.length && !channelsList.length) {
                console.log("No existing matches in panel to sync.");
                return;
              }

              function extractStreams(m) {
                let serverPairs = [];
                if (Array.isArray(m.streaming_links)) {
                  m.streaming_links.forEach(s => {
                    let link = s.link || s.url || "";
                    if (!link) return;
                    if (s.api && s.api.includes(":")) link += `|drmScheme=clearkey&drmLicense=${s.api}`;
                    serverPairs.push(`${link}#${s.name || "Server"}`);
                  });
                } else if (typeof m.streams === "string" && m.streams.trim()) {
                  serverPairs.push(m.streams.trim());
                } else if (m.stream_url || m.url) {
                  serverPairs.push(m.stream_url || m.url);
                }
                return serverPairs.join(" $ ");
              }

              eventsData.events.forEach(ev => {
                const evT1 = cleanStr(ev.team1_name || ev.team1 || "");
                const evT2 = cleanStr(ev.team2_name || ev.team2 || "");
                const evTitle = cleanStr(ev.tournament || ev.title || "");

                const matchedApi = apiMatches.find(m => {
                  const apiT1 = cleanStr(m.teamAName || m.team1 || m.team_a || m.home_team || m.team1_name || "");
                  const apiT2 = cleanStr(m.teamBName || m.team2 || m.team_b || m.away_team || m.team2_name || "");
                  const apiTitle = cleanStr(m.match_title || m.eventName || m.title || m.name || m.tournament || "");

                  const teamsMatched = (evT1 && evT2 && apiT1 && apiT2) && 
                                       ((evT1 === apiT1 && evT2 === apiT2) || (evT1 === apiT2 && evT2 === apiT1));
                  const titleMatched = (evTitle && apiTitle && (evTitle === apiTitle || evTitle.includes(apiTitle) || apiTitle.includes(evTitle)));

                  return teamsMatched || (titleMatched && (evT1 === apiT1 || evT2 === apiT2));
                });

                if (matchedApi) {
                  const newStreams = extractStreams(matchedApi);
                  if (newStreams && newStreams !== ev.stream_url) {
                    console.log(`Updated streams for event: ${ev.team1_name || ev.team1} vs ${ev.team2_name || ev.team2}`);
                    ev.stream_url = newStreams;
                    ev.streams = newStreams;
                    ev.url = newStreams;
                    hasEventsChanged = true;
                  }
                }
              });

              channelsList.forEach(ch => {
                if (ch.category !== "Live Event" && !ch.is_event) return;

                const chT1 = cleanStr(ch.team1 || (ch.name.includes(" vs ") ? ch.name.split(" vs ")[0] : ch.name));
                const chT2 = cleanStr(ch.team2 || (ch.name.includes(" vs ") ? ch.name.split(" vs ")[1] : ""));
                const chTitle = cleanStr(ch.title || ch.tournament || ch.name);

                const matchedApi = apiMatches.find(m => {
                  const apiT1 = cleanStr(m.teamAName || m.team1 || m.team_a || m.home_team || m.team1_name || "");
                  const apiT2 = cleanStr(m.teamBName || m.team2 || m.team_b || m.away_team || m.team2_name || "");
                  const apiTitle = cleanStr(m.match_title || m.eventName || m.title || m.name || m.tournament || "");

                  const teamsMatched = (chT1 && chT2 && apiT1 && apiT2) && 
                                       ((chT1 === apiT1 && chT2 === apiT2) || (chT1 === apiT2 && chT2 === apiT1));
                  const titleMatched = (chTitle && apiTitle && (chTitle === apiTitle || chTitle.includes(apiTitle) || apiTitle.includes(chTitle)));

                  return teamsMatched || (titleMatched && (chT1 === apiT1 || chT2 === apiT2));
                });

                if (matchedApi) {
                  const newStreams = extractStreams(matchedApi);
                  if (newStreams && newStreams !== ch.url) {
                    console.log(`Updated streams for channel item: ${ch.name}`);
                    ch.url = newStreams;
                    hasChannelsChanged = true;
                  }
                }
              });

              if (hasEventsChanged) {
                fs.writeFileSync(EVENTS_FILE, JSON.stringify(eventsData, null, 2));
              }
              if (hasChannelsChanged) {
                fs.writeFileSync(CHANNELS_FILE, JSON.stringify(channelsList, null, 2));
              }

              if (!hasEventsChanged && !hasChannelsChanged) {
                console.log("All existing matches are already up-to-date with latest server links.");
              }
            } catch (err) {
              console.error("Execution failed:", err.message);
            }
          }

          main();
          '

      - name: Commit and Push Updates
        run: |
          git config --global user.name 'BDStreamHub Sync Bot'
          git config --global user.email 'bot@bdstreamhub.com'
          git add events.json channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-synced live server links from API" && git push)
