name: IPTV Health Check Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install FFmpeg (includes ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Versions
        run: |
          node -v
          npm -v
          ffprobe -version

      - name: Install Dependencies
        run: npm install

      - name: Run IPTV Health Checker
        env:
          TZ: Asia/Dhaka
        run: node bot.js

      - name: Commit Changes
        run: |
          git config user.name "NowshinTV Bot"
          git config user.email "bot@nowshintv.local"
          git add channels.json playlist.m3u
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto Update: IPTV Health Check"
            git push
          fi
